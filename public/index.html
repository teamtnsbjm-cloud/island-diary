<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>무인도 일기</title>
<meta name="description" content="친구들과 같은 섬에서 낚시하고 물물교환하며 노는 3D 무인도">
<meta property="og:title" content="무인도 일기">
<meta property="og:description" content="할 일 없는 섬. 낚시하고, 멍때리고, 같이 놀자.">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f7f8c">
<!-- iPhone: 홈 화면에 추가하면 앱처럼 전체 화면으로 열려요 -->
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="무인도 일기">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:image" content="/icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-screen 3D island; notebook-paper HUD pinned to the corners. One committed tropical look. */
:root{
  --paper:#f6eedb; --ink:#2b2a26; --ink-soft:#6d6656; --sea:#1f7f8c; --coral:#e0683f;
  --panel:rgba(246,238,219,.93); --shade:rgba(20,32,40,.55);
  --display:"Gaegu","Comic Sans MS",cursive;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --st:calc(10px + env(safe-area-inset-top,0px)); --sb:calc(12px + env(safe-area-inset-bottom,0px));
  --sl:max(12px,env(safe-area-inset-left,0px)); --sr:max(12px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd3ef;color:var(--ink)}
body{font-family:var(--body);font-size:14px;-webkit-user-select:none;user-select:none}
/* fill the whole phone screen, also when opened from the home screen (iPhone reports a short viewport there) */
#game{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100lvh}
#game canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 rgba(43,42,38,.35)}
#hud{position:fixed;top:var(--st);left:var(--sl);padding:5px 8px;max-width:min(210px,52vw);display:flex;flex-direction:column;gap:3px}
.hudtop{display:flex;align-items:center;gap:4px}
#who{font-size:.74rem;display:flex;align-items:center;gap:5px;padding:2px 8px;min-width:0;overflow:hidden;text-overflow:ellipsis}
#who i{width:7px;height:7px;border-radius:50%;background:#9a958a;display:inline-block;flex:none}
#who.on i{background:#3fbf6a;box-shadow:0 0 0 3px rgba(63,191,106,.2)}
.mini{font:inherit;font-size:.8rem;line-height:1;background:#fffaf0;color:var(--ink);border:1.5px solid var(--ink);border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
#hudToggle{transition:transform .2s}
#hud.open #hudToggle{transform:rotate(180deg)}
#hudMore{display:flex;flex-direction:column;gap:4px}
#hud:not(.open) #hudMore{display:none}
.clockRow{display:flex;align-items:center;gap:6px}
#nameBtn{width:22px;height:22px;font-size:.7rem}
#nameForm{display:flex;gap:4px;align-items:center}
#nameIn{font:inherit;font-size:16px;width:110px;border:1.5px solid var(--ink);border-radius:6px;padding:1px 6px;background:#fffaf0;color:var(--ink);-webkit-user-select:text;user-select:text}
#clock{font-family:var(--display);font-size:1.05rem;line-height:1.1;font-weight:700;white-space:nowrap}
#clock small{font-weight:400;color:var(--ink-soft);font-size:.9rem}
#shipDot{color:var(--coral);font-size:.85rem;margin-left:4px}
#hud.open #shipDot{display:none}
#shipInfo{font-size:.78rem;color:var(--ink-soft)}
#shipInfo.here{color:var(--coral);font-weight:700}
.maprow{display:flex;gap:8px;align-items:flex-start}
#map{width:84px;height:84px;flex:none}
.legend{display:flex;flex-direction:column;gap:1px;font-size:.68rem;color:var(--ink-soft);min-width:0}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
#inv{position:fixed;top:var(--st);right:var(--sr);display:flex;flex-direction:column;align-items:flex-end}
#bagBtn{font:inherit;font-family:var(--display);font-size:1.05rem;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:4px;padding:4px 12px 4px 8px;border-radius:999px;cursor:pointer}
#bagBtn span{font-size:1.35rem;line-height:1}
#miniRes{display:grid;grid-template-columns:repeat(2,auto);gap:3px;margin-top:4px;justify-content:end}
#miniRes span{background:var(--panel);border:1.5px solid var(--ink);border-radius:10px;padding:0 6px;font-size:.72rem;line-height:1.5;font-variant-numeric:tabular-nums;text-align:right;min-width:38px}
.topBtns{display:flex;gap:6px;align-items:center}
#guideBtn{font-size:1.15rem;width:38px;height:38px;border-radius:50%;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
#guideWin .tabs{display:flex;gap:6px}
#guideWin .tabs button{flex:1}
#guideWin .tabs button.on{background:var(--sea);color:#fdf6e6}
.rules{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.88rem;line-height:1.5}
.rules li{background:#fffaf0;border:1.5px solid var(--line,#d9ccac);border-radius:8px;padding:6px 10px}
.offer.done{opacity:.6}
#bagPanel{padding:8px 10px;display:flex;flex-direction:column;gap:6px;align-items:stretch;width:min(240px,70vw)}
#bagPanel .bagHead{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:1.15rem;font-weight:700}
#bagPanel button.chip{text-align:left;white-space:normal}
#bagPanel .res{justify-content:flex-start}
.chip{font:inherit;font-size:.85rem;background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:14px;padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
button.chip{cursor:pointer;border-color:var(--sea);border-width:2px}
button.chip:disabled{opacity:.45;cursor:not-allowed}
.chip kbd,.emo kbd{font-family:inherit;font-size:.68rem;color:var(--ink-soft)}
.res{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:5px;background:rgba(255,250,240,.9);border-radius:999px;padding:2px 10px;font-size:.78rem;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.tag b{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--sea);color:#fdf6e6;font-size:.7rem;font-weight:700;margin-left:-7px}
.bub{position:absolute;left:50%;bottom:calc(100% + 5px);transform:translateX(-50%);background:#fffaf0;border:1.5px solid var(--ink);border-radius:12px;padding:3px 10px;font-size:.9rem;max-width:200px;white-space:normal;text-align:center;width:max-content}
.bub.emoji{background:none;border:0;font-size:1.7rem;padding:0}
#log{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 96px);width:min(420px,calc(100% - 32px));display:flex;flex-direction:column;gap:3px;pointer-events:none;align-items:center}
#log p{margin:0;background:var(--shade);color:#fdf6e6;border-radius:12px;padding:2px 12px;font-family:var(--display);font-size:1rem;text-align:center;text-wrap:balance;transition:opacity .35s}
#log p.out{opacity:0}
#log p.gold{background:rgba(180,120,20,.85)}
#prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 72px);padding:6px 16px;font-family:var(--display);font-size:1.35rem;white-space:nowrap;cursor:pointer;color:var(--ink)}
#prompt.no{opacity:.65;cursor:default}
#prompt kbd{font-family:var(--body);font-size:.85rem;border:1.5px solid var(--ink);border-radius:4px;padding:0 5px;margin-right:6px;background:#fffaf0}
#prompt.bite{background:#ffe08a;animation:shake .25s infinite}
@keyframes shake{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-52%) rotate(-2deg)}75%{transform:translateX(-48%) rotate(2deg)}}
#busy{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);padding:8px 16px;text-align:center;font-family:var(--display);font-size:1.3rem;min-width:180px}
#busy .bar{margin-top:5px;height:10px;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden;background:#fffaf0}
#busy .bar i{display:block;height:100%;background:var(--sea);width:0}
#toast{position:fixed;left:50%;top:calc(var(--st) + 4px);transform:translateX(-50%);padding:5px 16px;font-family:var(--display);font-size:1.3rem;max-width:min(520px,calc(100% - 32px));text-align:center;transition:opacity .4s;pointer-events:none}
#toast.off{opacity:0}
#emotes{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--sb);display:flex;gap:2px;padding:4px 8px;border-radius:999px;max-width:calc(100% - 24px);overflow-x:auto}
.emo{font:inherit;background:none;border:0;display:flex;flex-direction:column;align-items:center;color:var(--ink);padding:3px 8px;cursor:pointer;border-radius:14px;flex:none}
.emo span{font-size:1.3rem;line-height:1.2}
.emo small{font-size:.7rem;white-space:nowrap}
.emo:hover{background:rgba(31,127,140,.14)}
#chatForm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 72px);width:min(360px,calc(100% - 32px));display:flex;gap:6px;padding:5px}
#chatIn{flex:1;min-width:0;font:inherit;font-size:1rem;border:1.5px solid var(--ink);border-radius:8px;padding:5px 9px;background:#fffaf0;color:var(--ink);-webkit-user-select:text;user-select:text}
#joy{position:fixed;left:calc(var(--sl) + 8px);bottom:calc(var(--sb) + 8px);width:120px;height:120px;border-radius:50%;background:rgba(246,238,219,.35);border:2px solid rgba(43,42,38,.5);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--panel);border:2px solid var(--ink)}
#runBtn{position:fixed;right:calc(var(--sr) + 8px);bottom:calc(var(--sb) + 18px);width:78px;height:78px;border-radius:50%;font-family:var(--display);font-size:1.15rem;font-weight:700;cursor:pointer;color:var(--ink);touch-action:none;-webkit-tap-highlight-color:transparent}
#runBtn.on{background:#ffe08a;transform:scale(.94)}
#jumpBtn{position:fixed;right:calc(var(--sr) + 20px);bottom:calc(var(--sb) + 110px);width:56px;height:56px;border-radius:50%;font-family:var(--display);font-size:1rem;font-weight:700;cursor:pointer;color:var(--ink);touch-action:none;-webkit-tap-highlight-color:transparent}
#jumpBtn:active{background:#bfe8f5;transform:scale(.92)}
/* phone: emotes stack on the left edge, action prompt sits between the stick and the run button */
body.touch #emotes{left:var(--sl);top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;padding:6px 3px;border-radius:22px;max-width:none}
body.touch .emo{padding:4px 6px}
body.touch .emo span{font-size:1.2rem}
body.touch .emo small{display:none}
body.touch #prompt{left:calc(50vw + 20px);bottom:calc(var(--sb) + 40px);font-size:1rem;padding:5px 12px;white-space:normal;text-align:center;max-width:calc(100vw - 260px);line-height:1.2}
body.touch #prompt kbd{display:none}
body.touch #chatForm{top:calc(var(--st) + 130px);bottom:auto;left:calc(var(--sl) + 66px);right:calc(var(--sr) + 4px);width:auto;max-width:320px;margin-left:auto;transform:none;padding:3px;gap:4px}
body.touch #chatIn{font-size:16px;padding:3px 8px}
body.touch #chatForm .btn{font-size:.9rem!important;padding:1px 8px!important;box-shadow:2px 2px 0 var(--ink)}
body.touch #toast{top:calc(var(--st) + 62px);font-size:1.1rem}
body.touch #log{top:calc(var(--st) + 104px)}
.overlay{position:fixed;inset:0;background:rgba(15,30,40,.55);display:flex;align-items:center;justify-content:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--ink);padding:18px 20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto}
.card h2{font-family:var(--display);font-size:2.4rem;line-height:1;margin:0}
.card h3{font-family:var(--display);font-size:1.7rem;line-height:1;margin:0}
.card p{margin:0;line-height:1.6}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.86rem;color:var(--ink-soft)}
.keys b{color:var(--ink);font-weight:400;font-family:var(--display);font-size:1.05rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-family:var(--display);font-size:1.25rem;font-weight:700;background:#fffaf0;color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:5px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn.main{background:var(--sea);color:#fdf6e6}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.field{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--ink-soft)}
.field input{font:inherit;font-size:1.05rem;border:1.5px solid var(--ink);border-radius:8px;padding:6px 10px;background:#fffaf0;color:var(--ink);-webkit-user-select:text;user-select:text}
#costume{align-items:flex-end;background:linear-gradient(transparent 35%,rgba(15,30,40,.25))}
body:has(#costume:not([hidden])) :is(#emotes,#joy,#runBtn,#jumpBtn,#prompt,#log){display:none!important}
.card.costume{max-height:56%;gap:7px;padding:10px 14px;background:rgba(246,238,219,.62);box-shadow:3px 3px 0 rgba(43,42,38,.5);-webkit-backdrop-filter:none;backdrop-filter:none}
.card.costume .cOpt:not(.on){background:rgba(255,250,240,.78)}
.cRow{display:flex;flex-direction:column;gap:4px}
.cRow>b{font-family:var(--display);font-size:1.1rem}
.cOpts{display:flex;flex-wrap:wrap;gap:5px}
.cOpt{font:inherit;font-size:.82rem;background:#fffaf0;color:var(--ink);border:1.5px solid var(--ink);border-radius:14px;padding:3px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.cOpt.on{background:var(--sea);color:#fdf6e6;border-color:var(--sea)}
.cOpt:disabled{opacity:.45;cursor:not-allowed}
.cOpt i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.35);display:inline-block}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.fish{border:1.5px solid var(--ink);border-radius:8px;padding:6px 8px;background:#fffaf0;display:flex;flex-direction:column;gap:1px;min-width:0}
.fish.no{border-style:dashed;opacity:.55}
.fish .ic{font-size:1.5rem;line-height:1.1}
.fish b{font-family:var(--display);font-size:1.1rem}
.fish small{color:var(--ink-soft);font-size:.74rem;font-variant-numeric:tabular-nums}
.fish.legend{background:#fff3c4}
.offer{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:1.5px solid var(--ink);border-radius:8px;padding:8px 10px;background:#fffaf0}
.offer b{font-family:var(--display);font-size:1.2rem}
.offer small{grid-column:1;color:var(--ink-soft);font-size:.78rem}
.offer .give{grid-column:1;font-size:.85rem}
.offer .give span.lack{color:var(--coral)}
.offer button{grid-row:1/4;grid-column:2}
button:focus-visible,input:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="game"></div>
<div id="tags"></div>

<div id="hud" class="panel">
  <div class="hudtop">
    <button id="who" class="chip"><i></i><span id="whoText">혼자 있는 섬</span></button>
    <button id="hudToggle" class="mini" aria-expanded="false" aria-label="섬 정보 펼치기">▾</button>
  </div>
  <div class="clockRow"><div id="clock"></div><button id="nameBtn" class="mini" aria-label="이름 바꾸기" title="이름 바꾸기">✏️</button></div>
  <form id="nameForm" hidden><input id="nameIn" maxlength="12" autocomplete="off" enterkeyhint="done" aria-label="새 이름"><button class="mini" type="submit" aria-label="저장">✓</button></form>
  <div id="hudMore">
    <div id="shipInfo"></div>
    <div class="maprow"><canvas id="map" width="120" height="120" aria-label="섬 지도"></canvas>
      <div class="legend"><span><i style="background:#ff7a1a"></i>모닥불</span><span><i style="background:#a07a46"></i>선착장</span><span><i style="background:#d9533a"></i>꽃게 씨</span><span><i style="background:#ffffff;border:1px solid #2b2a26"></i>친구</span>
      <button class="chip" id="mute" style="font-size:.72rem;padding:1px 8px;margin-top:2px;align-self:flex-start">🔊 소리</button></div></div>
  </div>
</div>

<div id="inv">
  <div class="topBtns"><button id="guideBtn" class="panel" aria-label="규칙서와 교환소" aria-expanded="false">📖</button><button id="bagBtn" class="panel" aria-expanded="false"><span>🎒</span>가방</button></div>
  <div id="miniRes" aria-label="가진 것"></div>
  <div id="bagPanel" class="panel" hidden>
    <div class="bagHead">🎒 가방<button id="bagClose" class="mini" aria-label="가방 닫기">✕</button></div>
    <div class="res" id="res"></div>
    <button class="chip" id="invBtn">📦 인벤토리 · 설치하기</button>
    <button class="chip" id="dexBtn"></button>
    <button class="chip" id="hatBtn"></button>
  </div>
</div>

<div id="log"></div>
<div id="toast" class="panel off"></div>
<div id="busy" class="panel" hidden><span id="busyText"></span><div class="bar"><i id="busyBar"></i></div></div>
<button id="prompt" class="panel" hidden></button>
<form id="chatForm" class="panel" hidden><input id="chatIn" maxlength="40" placeholder="한마디 하기" autocomplete="off" enterkeyhint="send"><button class="btn" type="submit" style="font-size:1rem;padding:2px 10px">보내기</button></form>
<div id="emotes" class="panel"></div>
<div id="joy" hidden><div id="knob"></div></div>
<button id="runBtn" class="panel" hidden>달리기</button>
<button id="jumpBtn" class="panel" hidden>점프</button>

<div id="title" class="overlay">
  <div class="card">
    <h2>무인도 일기</h2>
    <p>할 일은 없다. 옷과 머리 모양을 골라 입고 나뭇가지와 조개를 줍고, 모닥불 앞에서 멍때리면 된다. 모은 재료를 교환소에서 낚싯대와 특별한 옷으로 바꾸고, 연못과 바다에서 물고기를 낚는다. 가끔 들르는 상선 '갈매기호'에서는 모자와 꾸미기를 바꿀 수 있다. 친구가 들어오면 같은 섬에서 만난다.</p>
    <label class="field">섬에서 쓸 이름<input id="nickIn" maxlength="12"></label>
    <div class="keys" id="keys"></div>
    <div class="row"><button class="btn main" id="go">섬으로 가기</button></div>
    <div class="row" id="installRow" hidden><button class="btn" id="installBtn" style="font-size:1rem">📲 홈 화면에 추가</button></div>
    <p id="iosHint" hidden style="font-size:.85rem;color:var(--ink-soft)">아이폰은 Safari 아래쪽 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 누르면 앱처럼 쓸 수 있어요.</p>
  </div>
</div>
<div id="dex" class="overlay" hidden></div>
<div id="trade" class="overlay" hidden></div>
<div id="costume" class="overlay" hidden></div>
<div id="invWin" class="overlay" hidden></div>
<div id="guideWin" class="overlay" hidden></div>
<div id="servers" class="overlay" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const chance=p=>Math.random()<p;
const DAY_LEN=600,R=110,CAP=100,KEY="island-diary-play-v1";
const touch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;

/* freshwater pond in the middle of the island: a bowl carved into the ground with its own water level */
const POND={x:-22,z:-16,r:9};
function groundH(x,z){
  const d=Math.hypot(x-POND.x,z-POND.z);
  if(d>POND.r+4)return rawH(x,z);
  const rim=POND.y+.35;
  if(d<POND.r)return POND.y-(.3+1.7*(1-(d/POND.r)**2));
  const k=(d-POND.r)/4,s=k*k*(3-2*k);return rim+(rawH(x,z)-rim)*s;
}
function inPond(x,z,pad){return Math.hypot(x-POND.x,z-POND.z)<POND.r+(pad||0)}
function rawH(x,z){
  const r=Math.hypot(x,z),ang=Math.atan2(z,x);
  const RR=R*(1+.12*Math.sin(ang*3+1)+.07*Math.sin(ang*5+2)+.03*Math.sin(ang*11));
  const t=1-(r/RR)*(r/RR);
  let h=t>0?3.2*Math.pow(t,.8):t*5;
  h+=.6*Math.sin(x*.09)*Math.cos(z*.075)*Math.max(0,t);
  const inland=Math.max(0,Math.min(1,t*3));
  h+=7*Math.exp(-((x-28)**2+(z+44)**2)/800)*inland;   // big hill, north-east
  h+=3.5*Math.exp(-((x+46)**2+(z-6)**2)/450)*inland;  // small hill, west
  return h-.6;
}
POND.y=rawH(POND.x,POND.z)-.25;
function rAt(a,h){let r=0;while(r<R*1.4){const x=Math.cos(a)*r,z=Math.sin(a)*r;if(groundH(x,z)<=h&&!inPond(x,z,1))break;r+=.3}return r} // walks past the pond to the real shore
// distance to the sea along each direction, for the ocean sound
const SHORE=[];for(let i=0;i<180;i++)SHORE.push(rAt(i/180*Math.PI*2,0));
function shoreDist(x,z){const a=(Math.atan2(z,x)+Math.PI*2)%(Math.PI*2),i=Math.floor(a/(Math.PI*2)*180)%180;return Math.max(0,SHORE[i]-Math.hypot(x,z))}
function hash(n){n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return n>>>0}

/* ---------- audio ---------- */
let actx=null,master=null,muted=false,oceanBus=null,rainBus=null;
// layered ocean: low swell + bright breaking "shhh" waves on a random schedule, rain on top
function noiseBuf(sec,kind){
  const n=actx.sampleRate*sec,buf=actx.createBuffer(2,n,actx.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let b0=0,b1=0,b2=0,last=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;
      if(kind==="brown"){last=(last+.02*w)/1.02;d[i]=last*3.2}
      else{b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.0526;d[i]=(b0+b1+b2+w*.1848)*.18}}}
  return buf}
function loopSrc(buf){const s=actx.createBufferSource();s.buffer=buf;s.loop=true;s.loopStart=Math.random();s.start(0,Math.random()*2);return s}
function startAudio(){
  if(actx)return;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=.75;master.connect(actx.destination);
    oceanBus=actx.createGain();oceanBus.gain.value=.5;oceanBus.connect(master);
    const brown=noiseBuf(6,"brown"),pink=noiseBuf(6,"pink");
    // deep swell that breathes slowly
    const sw=loopSrc(brown),swF=actx.createBiquadFilter();swF.type="lowpass";swF.frequency.value=320;
    const swG=actx.createGain();swG.gain.value=.32;const lfo=actx.createOscillator();lfo.frequency.value=.07;const lg=actx.createGain();lg.gain.value=.12;lfo.connect(lg);lg.connect(swG.gain);lfo.start();
    sw.connect(swF);swF.connect(swG);swG.connect(oceanBus);
    // constant fizz of foam on the sand
    const fz=loopSrc(pink),fzF=actx.createBiquadFilter();fzF.type="highpass";fzF.frequency.value=2500;const fzG=actx.createGain();fzG.gain.value=.025;
    fz.connect(fzF);fzF.connect(fzG);fzG.connect(oceanBus);
    // breaking waves: bright wash swelling in and hissing out
    const wv=loopSrc(pink),wvF=actx.createBiquadFilter();wvF.type="bandpass";wvF.Q.value=.5;wvF.frequency.value=900;
    const wvG=actx.createGain();wvG.gain.value=0;const pan=actx.createStereoPanner?actx.createStereoPanner():null;
    wv.connect(wvF);wvF.connect(wvG);if(pan){wvG.connect(pan);pan.connect(oceanBus)}else wvG.connect(oceanBus);
    const wave=()=>{if(!actx)return;const t=actx.currentTime,rise=1.4+Math.random()*1.2,fall=2.8+Math.random()*2.5,peak=.35+Math.random()*.35;
      wvG.gain.cancelScheduledValues(t);wvG.gain.setValueAtTime(wvG.gain.value,t);wvG.gain.linearRampToValueAtTime(peak,t+rise);wvG.gain.setTargetAtTime(.02,t+rise,fall/3);
      wvF.frequency.cancelScheduledValues(t);wvF.frequency.setValueAtTime(600,t);wvF.frequency.linearRampToValueAtTime(2200+Math.random()*1200,t+rise);wvF.frequency.setTargetAtTime(700,t+rise,fall/2.5);
      if(pan)pan.pan.setTargetAtTime((Math.random()-.5)*.8,t,.5);
      setTimeout(wave,(rise+fall*.8+Math.random()*3)*1000)};
    wave();
    // rain
    rainBus=actx.createGain();rainBus.gain.value=0;rainBus.connect(master);
    const rn=loopSrc(pink),rnF=actx.createBiquadFilter();rnF.type="highpass";rnF.frequency.value=1800;rn.connect(rnF);rnF.connect(rainBus);
  }catch(e){actx=null}
}
function gull(){if(!actx||muted)return;try{const t=actx.currentTime;for(let k=0;k<2;k++){const o=actx.createOscillator(),g=actx.createGain(),t0=t+k*.32;o.type="triangle";
  o.frequency.setValueAtTime(1900,t0);o.frequency.exponentialRampToValueAtTime(1150,t0+.25);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.035,t0+.04);g.gain.exponentialRampToValueAtTime(.001,t0+.28);
  o.connect(g);g.connect(oceanBus);o.start(t0);o.stop(t0+.3)}}catch(e){}}
function setAmbience(prox,rain){if(!actx)return;const t=actx.currentTime;
  oceanBus.gain.setTargetAtTime(.06+.94*prox,t,.4);rainBus.gain.setTargetAtTime(rain*.22,t,1)}
function beep(freq,dur,type,vol,delay){
  if(!actx||muted)return;
  try{const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+(delay||0);o.type=type||"triangle";o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur)}catch(e){}
}
function horn(){beep(98,1.6,"sawtooth",.12);beep(147,1.6,"sawtooth",.06)}
function strum(){[392,494,587,784].forEach((f,i)=>beep(f,.6,"triangle",.1,i*.09))}
$("mute").onclick=()=>{muted=!muted;startAudio();if(master)master.gain.value=muted?0:.75;if(muted&&window.speechSynthesis)speechSynthesis.cancel();$("mute").textContent=muted?"🔇 꺼짐":"🔊 소리";};

{const c=mapBg.getContext("2d"),img=c.createImageData(MS,MS);

/* fishing gear: a bobber flying out in an arc, then a sagging line; one for me and one per friend who fishes */
const LINE_N=14,_tip=new THREE.Vector3();

  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(new Float32Array(LINE_N*3),3));
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.75}));l.visible=false;l.frustumCulled=false;scene.add(l);
  return{b,l,cast:1,from:new THREE.Vector3(),to:new THREE.Vector3()}}
function rodTip(ch){ch.rod.updateMatrixWorld(true);return _tip.set(0,2.4,0).applyMatrix4(ch.rod.matrixWorld)}
function castGear(G,ch,bx,bz){G.from.copy(rodTip(ch));G.to.set(bx,0,bz);G.cast=-.45;G.lvl=inPond(bx,bz)?POND.y:0;G.b.visible=G.l.visible=true}

function updGear(G,ch,t,dt,bite){
  if(!G.b.visible)return;const tip=rodTip(ch),wy=G.lvl?G.lvl+Math.sin(t*1.4+G.to.x)*.02:waveY(G.to.x,G.to.z,t);
  if(G.cast<0){G.cast+=dt/.6;G.b.position.copy(tip);if(G.cast>=0)G.from.copy(tip)}   // wind-up: bobber hangs at the rod tip
  else if(G.cast<1){G.cast=Math.min(1,G.cast+dt/.6);const k=G.cast;G.b.position.lerpVectors(G.from,G.to,k);G.b.position.y=G.from.y+(wy-G.from.y)*k+Math.sin(k*Math.PI)*4.5}
  else G.b.position.set(G.to.x,wy+.05-(bite?.22+Math.sin(t*25)*.08:Math.sin(t*3)*.03),G.to.z);
  const pa=G.l.geometry.attributes.position,dx=G.b.position.x-tip.x,dy=G.b.position.y+.12-tip.y,dz=G.b.position.z-tip.z,sag=Math.hypot(dx,dz)*.06*Math.max(0,G.cast);

    shots.push({kind,t:0,m,flash,v:new THREE.Vector3(dir.x*30,.6,dir.z*30)});beep(1800,.05,"square",.05);beep(700,.06,"triangle",.05,.02)}
